services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage_pw
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 3s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      DATABASE_URL: postgres://heritage:heritage_pw@db:5432/heritage
      PORT: "3000"
      HOLD_SECONDS: "60"
      ADMIN_TOKEN: "change-me-admin-token"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
